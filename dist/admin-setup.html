<!doctype html><html lang="ko"><head><meta charset="utf-8"><script src="/theme.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>MUSE · 최고 관리자 최초 설정</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/social.css"><link rel="stylesheet" href="/beta.css"><link rel="stylesheet" href="/theme.css"></head><body><main id="authGate"><a class="logo" href="/">muse<span>.</span></a><h1>최고 관리자 최초 설정</h1><p>사이트 소유자만 설정할 수 있어요.<br>비밀번호는 이 HTTPS 화면에 직접 입력해주세요.</p><p id="setupStatus" role="status">소유자와 계정 상태를 확인하고 있어요.</p><section id="setupContent" hidden><p>관리자 ID: <b>muse.admin</b> · 권한: <b>super_admin</b></p><button id="startAdminSetup" class="primary">인증 앱 등록 시작</button><form id="completeAdminSetup" hidden><label>인증 앱 등록 키<input id="adminSetupSecret" readonly autocomplete="off"></label><p>인증 앱에서 ‘직접 입력’으로 등록하세요.<br>이름: MUSE 최고 관리자 · 시간 기준 · 6자리 · 30초</p><button type="button" id="copyAdminSecret">등록 키 복사</button><label>비밀번호<input id="adminSetupPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>비밀번호 확인<input id="adminSetupConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>인증 앱 코드<input id="adminSetupCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><p>등록 키를 채팅이나 다른 사람에게 공유하지 마세요. 인증 앱을 잃으면 별도 소유자 확인이 필요해요.</p><a href="/" target="_blank" rel="noopener">MUSE 개인정보 안내 확인</a><label class="setting-check"><input id="adminSetupAgree" type="checkbox" required> 개인정보 처리 안내를 확인하고 계정을 생성해요.</label><button class="primary" type="submit">최고 관리자 생성</button></form></section><p id="setupError" role="alert"></p></main><script src="/admin-setup.js"></script></body></html>
